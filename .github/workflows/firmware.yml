name: Firmware checks
on:
  pull_request:
    paths: ['firmware/**', '.github/workflows/firmware.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 firmware/tests/main_host/run.py
  arduino:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.3.1'
      - name: Install pinned toolchain
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.11
          arduino-cli lib install VL53L0X@1.3.1
      - name: Compile offline XIAO sketch (no deployment credentials)
        run: arduino-cli compile --fqbn esp32:esp32:XIAO_ESP32S3 --warnings all firmware/main
  idf-connected:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Compile custom-SDK connected profile (no deployment credentials)
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          python firmware/idf/build.py --connected
